services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aerdrya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aerdrya}
      POSTGRES_DB: ${POSTGRES_DB:-numbers_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aerdrya} -d ${POSTGRES_DB:-numbers_db}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aerdrya}:${POSTGRES_PASSWORD:-aerdrya}@db:5432/${POSTGRES_DB:-numbers_db}
    ports:
      - "8006:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
